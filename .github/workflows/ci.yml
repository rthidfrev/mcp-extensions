name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  rust:
    name: Rust (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: "1.88.0"
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +${{ matrix.toolchain }} fmt --check
      - name: Lint
        run: cargo +${{ matrix.toolchain }} clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests and documentation examples
        run: cargo +${{ matrix.toolchain }} test --locked --all-features
      - name: Minimal library build
        run: cargo +${{ matrix.toolchain }} check --locked --lib --no-default-features
      - name: Documentation
        run: cargo +${{ matrix.toolchain }} doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify crate archive
        run: cargo +${{ matrix.toolchain }} package --locked --allow-dirty

  # Keep the required status name used by the repository's branch rules.
  check:
    needs: [checks, rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require successful checks
        env:
          RESULT: ${{ needs.checks.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: test "$RESULT" = success && test "$RUST_RESULT" = success

  publish-marketplace:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: marketplace-release
      queue: max
    steps:
      - name: Download marketplace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marketplace

      - name: Publish latest marketplace
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          notes="Prebuilt marketplace from $GITHUB_SHA. Updated in place after successful main builds."
          if gh release view marketplace-latest > /dev/null 2>&1; then
            comparison=$(gh api "repos/$GH_REPO/compare/marketplace-latest...$GITHUB_SHA" --jq .status)
            if [ "$comparison" != "ahead" ] && [ "$comparison" != "identical" ]; then
              echo "Skipping a build that does not follow the published commit."
              exit 0
            fi
            gh release upload marketplace-latest marketplace.zip --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/marketplace-latest" \
              -f sha="$GITHUB_SHA" --silent
            gh release edit marketplace-latest --notes "$notes" --latest=false
          else
            gh release create marketplace-latest marketplace.zip \
              --target "$GITHUB_SHA" \
              --title "Latest marketplace" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi
