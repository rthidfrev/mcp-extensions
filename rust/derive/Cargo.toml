[package]
name = "openai-mcp-extensions-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Optional flat-model derives for OpenAI MCP Extensions"
license = "Apache-2.0"
repository = "https://github.com/openai/mcp-extensions"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
