[package]
name = "openai-mcp-extensions"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "OpenAI MCP Extensions for Rust servers built with rmcp"
license = "Apache-2.0"
repository = "https://github.com/openai/mcp-extensions"
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
rmcp = { version = "3.5.0", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jsonschema = { version = "0.58.5", default-features = false }
base64 = "0.22"
fluent-uri = "0.4.1"

[dev-dependencies]
rmcp = { version = "3.5.0", default-features = false, features = ["client", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "server"
test = true
